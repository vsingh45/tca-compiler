<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-profiler" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-estimator" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-rewriter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-assigner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-compiler" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-memory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-output" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6a88;stop-opacity:1" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>

    <filter id="shadow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="40" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a202c">
    TCA-Compiler Architecture
  </text>
  <text x="600" y="70" font-size="14" text-anchor="middle" fill="#718096">
    End-to-End Memory Injection Cost Optimization
  </text>

  <!-- ============ STAGE 1: INPUT ============ -->
  <g filter="url(#shadow)">
    <rect x="350" y="120" width="500" height="100" rx="12" fill="url(#grad-input)"/>
    <text x="600" y="150" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      📊 LLM Agent Workflow (DAG)
    </text>
    <text x="600" y="180" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)">
      Extract → SQL-Gen → Billing-Recon → Policy-Check (depth 1-4)
    </text>
  </g>

  <!-- Arrow down -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#cbd5e0"/>
    </marker>
  </defs>
  <line x1="600" y1="220" x2="600" y2="270" stroke="#cbd5e0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 2: LEARNING ============ -->
  <g filter="url(#shadow)">
    <rect x="350" y="270" width="500" height="100" rx="12" fill="url(#grad-profiler)"/>
    <text x="600" y="300" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      📈 Cost Profiler (SQLite-backed)
    </text>
    <text x="600" y="330" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)">
      Per-node priors: input_tokens, output_tokens, tier × strategy
    </text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="370" x2="600" y2="420" stroke="#cbd5e0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 3: ANALYSIS (3 columns) ============ -->
  <!-- Estimator (left) -->
  <g filter="url(#shadow)">
    <rect x="80" y="420" width="280" height="140" rx="12" fill="url(#grad-estimator)"/>
    <text x="220" y="450" font-size="17" font-weight="bold" text-anchor="middle" fill="white">
      🔢 Estimator
    </text>
    <text x="220" y="475" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.95)">
      Memory Injection Cost
    </text>
    <circle cx="140" cy="520" r="25" fill="rgba(255,255,255,0.25)"/>
    <text x="140" y="527" font-size="11" text-anchor="middle" fill="white" font-weight="bold">O(d²)</text>

    <text x="220" y="540" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.9)">
      Growth by depth
    </text>
  </g>

  <!-- Rewriter (center) -->
  <g filter="url(#shadow)">
    <rect x="460" y="420" width="280" height="140" rx="12" fill="url(#grad-rewriter)"/>
    <text x="600" y="450" font-size="17" font-weight="bold" text-anchor="middle" fill="white">
      ⚙️ Graph Rewriter
    </text>
    <text x="600" y="475" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.95)">
      DAG Optimizations
    </text>
    <g transform="translate(600, 510)">
      <text x="-40" y="0" font-size="11" fill="white">T1: Fusion</text>
      <text x="-40" y="15" font-size="11" fill="white">T2: Reorder</text>
      <text x="-40" y="30" font-size="11" fill="white">T3: Namespace</text>
    </g>
  </g>

  <!-- Tier Assigner (right) -->
  <g filter="url(#shadow)">
    <rect x="840" y="420" width="280" height="140" rx="12" fill="url(#grad-assigner)"/>
    <text x="980" y="450" font-size="17" font-weight="bold" text-anchor="middle" fill="white">
      🎯 Tier Assigner
    </text>
    <text x="980" y="475" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.95)">
      Joint Optimization
    </text>
    <g transform="translate(980, 510)">
      <text x="-30" y="0" font-size="11" fill="white">Haiku</text>
      <text x="-30" y="15" font-size="11" fill="white">Sonnet</text>
      <text x="-30" y="30" font-size="11" fill="white">Accuracy SLO</text>
    </g>
  </g>

  <!-- Arrows converging -->
  <path d="M 220 560 Q 300 600 350 620" stroke="#cbd5e0" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 560 L 600 620" stroke="#cbd5e0" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 980 560 Q 900 600 850 620" stroke="#cbd5e0" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 4: COMPILATION ============ -->
  <g filter="url(#shadow-lg)">
    <rect x="250" y="620" width="700" height="120" rx="12" fill="url(#grad-compiler)"/>
    <text x="600" y="655" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      🚀 TCA-Compiler Optimizer
    </text>
    <text x="600" y="685" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)">
      for each node: enumerate (strategy, tier) → estimate cost → filter by SLO → select minimum-TCA
    </text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="740" x2="600" y2="790" stroke="#cbd5e0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 5: ROUTING ============ -->
  <g filter="url(#shadow)">
    <rect x="300" y="790" width="600" height="140" rx="12" fill="#2d3748" opacity="0.95"/>

    <text x="600" y="820" font-size="18" font-weight="bold" text-anchor="middle" fill="#48bb78">
      📋 Routing Table (Per-Node Assignments)
    </text>

    <!-- Node examples -->
    <g transform="translate(320, 840)">
      <rect width="130" height="80" rx="6" fill="#1a202c" stroke="#48bb78" stroke-width="1.5"/>
      <text x="65" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#48bb78">extract</text>
      <text x="65" y="35" font-size="10" text-anchor="middle" fill="#cbd5e0">haiku</text>
      <text x="65" y="50" font-size="10" text-anchor="middle" fill="#cbd5e0">warm-shared</text>
      <text x="65" y="65" font-size="10" text-anchor="middle" fill="#f6ad55">\$0.0015</text>
    </g>

    <g transform="translate(470, 840)">
      <rect width="130" height="80" rx="6" fill="#1a202c" stroke="#4299e1" stroke-width="1.5"/>
      <text x="65" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#4299e1">sql-gen</text>
      <text x="65" y="35" font-size="10" text-anchor="middle" fill="#cbd5e0">sonnet</text>
      <text x="65" y="50" font-size="10" text-anchor="middle" fill="#cbd5e0">warm-iso</text>
      <text x="65" y="65" font-size="10" text-anchor="middle" fill="#f6ad55">\$0.0042</text>
    </g>

    <g transform="translate(620, 840)">
      <rect width="130" height="80" rx="6" fill="#1a202c" stroke="#ed8936" stroke-width="1.5"/>
      <text x="65" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#ed8936">billing</text>
      <text x="65" y="35" font-size="10" text-anchor="middle" fill="#cbd5e0">haiku</text>
      <text x="65" y="50" font-size="10" text-anchor="middle" fill="#cbd5e0">warm-shared</text>
      <text x="65" y="65" font-size="10" text-anchor="middle" fill="#f6ad55">\$0.0018</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="930" x2="600" y2="980" stroke="#cbd5e0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 6: MEMORY & EXECUTION ============ -->
  <g filter="url(#shadow)">
    <rect x="250" y="980" width="700" height="120" rx="12" fill="url(#grad-memory)"/>
    <text x="600" y="1015" font-size="19" font-weight="bold" text-anchor="middle" fill="#2d3748">
      💾 TCA-Memory Backend + Execution
    </text>
    <g transform="translate(600, 1050)">
      <text x="-80" y="0" font-size="11" fill="#2d3748">✓ Two-tier storage</text>
      <text x="0" y="0" font-size="11" fill="#2d3748">✓ Cost-aware eviction</text>
      <text x="100" y="0" font-size="11" fill="#2d3748">✓ Shared namespaces</text>
      <text x="-80" y="20" font-size="11" fill="#2d3748">✓ Retrieve memory</text>
      <text x="0" y="20" font-size="11" fill="#2d3748">✓ API calls</text>
      <text x="100" y="20" font-size="11" fill="#2d3748">✓ Record costs</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="1100" x2="600" y2="1150" stroke="#cbd5e0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- ============ STAGE 7: RESULTS ============ -->
  <g filter="url(#shadow-lg)">
    <rect x="300" y="1150" width="600" height="140" rx="12" fill="url(#grad-output)"/>
    <text x="600" y="1185" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      📊 Results & Analysis
    </text>

    <g transform="translate(350, 1200)">
      <circle cx="12" cy="12" r="4" fill="white"/>
      <text x="25" y="16" font-size="11" fill="white">cost_total per node</text>

      <circle cx="12" cy="32" r="4" fill="white"/>
      <text x="25" y="36" font-size="11" fill="white">cost_inference (API)</text>

      <circle cx="12" cy="52" r="4" fill="white"/>
      <text x="25" y="56" font-size="11" fill="white">cost_injection (memory)</text>
    </g>

    <g transform="translate(550, 1200)">
      <circle cx="12" cy="12" r="4" fill="white"/>
      <text x="25" y="16" font-size="11" fill="white">accuracy metrics</text>

      <circle cx="12" cy="32" r="4" fill="white"/>
      <text x="25" y="36" font-size="11" fill="white">warm hit rate</text>

      <circle cx="12" cy="52" r="4" fill="white"/>
      <text x="25" y="56" font-size="11" fill="white">CSV per-node records</text>
    </g>
  </g>

  <!-- ============ KEY METRICS (bottom) ============ -->
  <g transform="translate(0, 1330)">
    <text x="600" y="0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="bold">
      Key Results: 59% cost reduction | 27.6% memory at depth 6 | O(d²) confirmed
    </text>
  </g>
</svg>
